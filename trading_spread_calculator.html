<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Trading Pro - Exact Precision</title>
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,900;1,400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen flex items-center justify-center p-4 md:p-8 transition-colors duration-300">

    <div class="bg-white dark:bg-gray-900 p-6 md:p-8 rounded-3xl shadow-2xl border border-gray-200/80 dark:border-gray-800 w-full max-w-full md:max-w-5xl transition-colors duration-300">
        
        <!-- HEADER -->
        <div class="flex justify-between items-center mb-6 border-b border-gray-100 dark:border-gray-800 pb-4">
            <div>
                <h1 class="text-xl md:text-2xl font-extrabold text-blue-600 dark:text-blue-400 tracking-tight">Trading RR & Spread Calculator</h1>
                <p class="text-xs text-gray-500 dark:text-gray-400 font-medium">Kalkulator Akurat dengan Penyesuaian Spread</p>
            </div>
            
            <button onclick="toggleDarkMode()" id="btnTheme" class="p-2.5 rounded-xl bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 cursor-pointer transition-all text-xs font-semibold flex items-center gap-2 border border-gray-200 dark:border-gray-700">
                <span id="themeIcon">🌙</span> <span id="themeText" class="hidden sm:inline">Dark</span>
            </button>
        </div>
        
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 md:gap-8">
            
            <!-- INPUT FORM SECTION -->
            <div class="lg:col-span-7 space-y-5">
                
                <!-- TIPE POSISI (BUY / SELL) -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-2">Arah Posisi</label>
                    <div class="grid grid-cols-2 gap-3">
                        <button type="button" id="btnBuy" onclick="setDirection('BUY')" class="py-3 rounded-xl font-bold text-center border-2 border-green-500 bg-green-500 text-white shadow-lg shadow-green-500/20 cursor-pointer transition-all">BUY</button>
                        <button type="button" id="btnSell" onclick="setDirection('SELL')" class="py-3 rounded-xl font-bold text-center border-2 border-red-500/30 text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/30 cursor-pointer transition-all">SELL</button>
                    </div>
                </div>

                <!-- ENTRY & SPREAD -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1">Harga Entry (Base)</label>
                        <input type="number" id="entryPrice" step="any" value="4531.00" oninput="saveAndCalculate()" class="w-full px-3.5 py-2.5 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-900 dark:text-white rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm font-mono font-semibold transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1">Spread (Points)</label>
                        <input type="number" id="spreadPoints" value="40" oninput="saveAndCalculate()" class="w-full px-3.5 py-2.5 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-900 dark:text-white rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm font-mono font-semibold transition-all">
                        <p class="text-[11px] text-gray-400 dark:text-gray-500 mt-1 font-medium" id="spreadInfo">*40 points = 4 pips</p>
                    </div>
                </div>

                <!-- STOPLOSS SECTION -->
                <div class="p-4 bg-gray-50 dark:bg-gray-800/50 rounded-2xl border border-gray-200/80 dark:border-gray-700/60 space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-bold uppercase tracking-wider text-red-600 dark:text-red-400 flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-red-500"></span>
                            Stoploss (SL)
                        </label>
                        <!-- TOGGLE MODE SL -->
                        <div class="flex items-center bg-gray-200 dark:bg-gray-700 p-1 rounded-lg text-[11px] font-bold">
                            <button type="button" id="btnSlModePoint" onclick="setSlMode('POINTS')" class="px-2.5 py-1 rounded-md transition-all cursor-pointer">Points</button>
                            <button type="button" id="btnSlModePrice" onclick="setSlMode('PRICE')" class="px-2.5 py-1 rounded-md transition-all cursor-pointer">Harga</button>
                        </div>
                    </div>
                    <div>
                        <input type="number" id="slValue" step="any" value="400" oninput="saveAndCalculate()" placeholder="Masukkan Points atau Harga SL..." class="w-full px-3.5 py-2.5 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-900 dark:text-white rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-red-500 text-sm font-mono font-semibold transition-all">
                        <p class="text-[11px] text-gray-400 dark:text-gray-500 mt-1 font-medium" id="slPointInfo">*Points to Pips</p>
                    </div>
                </div>

                <!-- TAKE PROFIT CUSTOM SECTION (POINTS / HARGA) -->
                <div class="p-4 bg-gray-50 dark:bg-gray-800/50 rounded-2xl border border-gray-200/80 dark:border-gray-700/60 space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-bold uppercase tracking-wider text-green-600 dark:text-green-400 flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-green-500"></span>
                            Take Profit Custom (Opsional)
                        </label>
                        <!-- TOGGLE MODE TP -->
                        <div class="flex items-center bg-gray-200 dark:bg-gray-700 p-1 rounded-lg text-[11px] font-bold">
                            <button type="button" id="btnTpModePoint" onclick="setTpMode('POINTS')" class="px-2.5 py-1 rounded-md transition-all cursor-pointer">Points</button>
                            <button type="button" id="btnTpModePrice" onclick="setTpMode('PRICE')" class="px-2.5 py-1 rounded-md transition-all cursor-pointer">Harga</button>
                        </div>
                    </div>
                    <div>
                        <input type="number" id="tpValue" step="any" placeholder="Masukkan Points atau Harga TP..." oninput="saveAndCalculate()" class="w-full px-3.5 py-2.5 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-900 dark:text-white rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-green-500 text-sm font-mono font-semibold transition-all">
                        <p class="text-[11px] text-gray-400 dark:text-gray-500 mt-1 font-medium" id="tpPointInfo">*Points to Pips</p>
                    </div>
                </div>

                <!-- KOMPONEN DISESUAIKAN SPREAD -->
                <div class="p-4 bg-blue-50/60 dark:bg-blue-950/30 rounded-2xl border border-blue-100 dark:border-blue-900/40">
                    <label class="block text-[11px] font-bold text-blue-700 dark:text-blue-300 mb-2.5 uppercase tracking-wider">Komponen yang Disesuaikan dengan Spread:</label>
                    <div class="grid grid-cols-3 gap-2 text-xs">
                        <label class="flex items-center gap-2 p-2.5 rounded-xl bg-white dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700/80 cursor-pointer hover:bg-blue-100/50 dark:hover:bg-gray-800 transition-all">
                            <input type="checkbox" id="chkAdjustEntry" checked onchange="saveAndCalculate()" class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600">
                            <span class="font-semibold text-gray-700 dark:text-gray-300">Entry</span>
                        </label>
                        <label class="flex items-center gap-2 p-2.5 rounded-xl bg-white dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700/80 cursor-pointer hover:bg-blue-100/50 dark:hover:bg-gray-800 transition-all">
                            <input type="checkbox" id="chkAdjustSL" checked onchange="saveAndCalculate()" class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600">
                            <span class="font-semibold text-gray-700 dark:text-gray-300">Stoploss</span>
                        </label>
                        <label class="flex items-center gap-2 p-2.5 rounded-xl bg-white dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700/80 cursor-pointer hover:bg-blue-100/50 dark:hover:bg-gray-800 transition-all">
                            <input type="checkbox" id="chkAdjustTP" onchange="saveAndCalculate()" class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600">
                            <span class="font-semibold text-gray-700 dark:text-gray-300">Take Profit</span>
                        </label>
                    </div>
                </div>

                <!-- DIGIT PRECISION -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1">Jumlah Digit Koma (Decimal)</label>
                    <select id="decimalPlaces" onchange="saveAndCalculate()" class="w-full px-3.5 py-2.5 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-900 dark:text-white rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm font-semibold cursor-pointer transition-all">
                        <option value="0">0 (Contoh: 4531)</option>
                        <option value="1">1 (Contoh: 4531.0)</option>
                        <option value="2" selected>2 (Contoh: 4531.00)</option>
                        <option value="3">3 (Contoh: 1950.123)</option>
                        <option value="4">4 (Contoh: 1.1234)</option>
                        <option value="5">5 (Contoh: 1.12345)</option>
                    </select>
                </div>

            </div>

            <!-- OUTPUT RESULTS SECTION -->
            <div class="lg:col-span-5 flex flex-col justify-center space-y-4">
                
                <div class="bg-gray-50 dark:bg-gray-800/40 p-5 rounded-3xl border border-gray-200/80 dark:border-gray-700/60 space-y-3 shadow-inner">
                    <h3 class="text-xs font-extrabold uppercase tracking-widest text-gray-400 dark:text-gray-500 mb-1">Hasil Eksekusi Order</h3>

                    <!-- ENTRY RESULT -->
                    <div class="flex justify-between items-center p-3.5 bg-white dark:bg-gray-800 rounded-2xl border-l-4 border-blue-500 shadow-sm border border-gray-100 dark:border-gray-700/80">
                        <div>
                            <span class="text-[11px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 block">ENTRY EXECUTION</span>
                            <span id="outEntry" class="font-mono font-black text-gray-900 dark:text-white text-lg md:text-xl">-</span>
                        </div>
                        <button onclick="copyToClipboard('outEntry', this)" class="px-3 py-1.5 text-xs bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 rounded-lg font-bold transition-all cursor-pointer">Copy</button>
                    </div>

                    <!-- STOPLOSS RESULT -->
                    <div class="flex justify-between items-center p-3.5 bg-white dark:bg-gray-800 rounded-2xl border-l-4 border-red-500 shadow-sm border border-gray-100 dark:border-gray-700/80">
                        <div>
                            <span class="text-[11px] font-bold uppercase tracking-wider text-red-600 dark:text-red-400 block">STOPLOSS</span>
                            <span id="outSL" class="font-mono font-black text-red-600 dark:text-red-400 text-lg md:text-xl">-</span>
                        </div>
                        <button onclick="copyToClipboard('outSL', this)" class="px-3 py-1.5 text-xs bg-red-50 hover:bg-red-100 dark:bg-red-950/60 dark:hover:bg-red-900/80 text-red-600 dark:text-red-300 rounded-lg font-bold transition-all cursor-pointer">Copy</button>
                    </div>

                    <!-- TAKE PROFIT CUSTOM RESULT -->
                    <div id="boxCustomTP" class="flex justify-between items-center p-3.5 bg-white dark:bg-gray-800 rounded-2xl border-l-4 border-green-500 shadow-sm border border-gray-100 dark:border-gray-700/80">
                        <div>
                            <span class="text-[11px] font-bold uppercase tracking-wider text-green-600 dark:text-green-400 block">TAKE PROFIT (CUSTOM)</span>
                            <span id="outCustomTP" class="font-mono font-black text-green-600 dark:text-green-400 text-lg md:text-xl">-</span>
                        </div>
                        <button onclick="copyToClipboard('outCustomTP', this)" class="px-3 py-1.5 text-xs bg-green-50 hover:bg-green-100 dark:bg-green-950/60 dark:hover:bg-green-900/80 text-green-600 dark:text-green-300 rounded-lg font-bold transition-all cursor-pointer">Copy</button>
                    </div>

                    <!-- REKOMENDASI RISK REWARD TAKE PROFIT -->
                    <div class="pt-2">
                        <span class="text-[11px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 block mb-2">Rekomendasi Take Profit (RR):</span>
                        <div class="space-y-2">
                            <div class="flex justify-between items-center p-2.5 bg-white dark:bg-gray-800/90 rounded-xl border border-gray-100 dark:border-gray-700/60">
                                <span class="text-xs font-bold text-gray-600 dark:text-gray-300">TP 1 (1:1)</span>
                                <div class="flex items-center gap-2">
                                    <span id="recTP1" class="font-mono font-bold text-green-600 dark:text-green-400 text-sm">-</span>
                                    <button onclick="copyToClipboard('recTP1', this)" class="px-2 py-1 text-[10px] bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 rounded font-bold transition-all cursor-pointer">Copy</button>
                                </div>
                            </div>
                            <div class="flex justify-between items-center p-2.5 bg-white dark:bg-gray-800/90 rounded-xl border border-gray-100 dark:border-gray-700/60">
                                <span class="text-xs font-bold text-gray-600 dark:text-gray-300">TP 2 (1:2)</span>
                                <div class="flex items-center gap-2">
                                    <span id="recTP2" class="font-mono font-bold text-green-600 dark:text-green-400 text-sm">-</span>
                                    <button onclick="copyToClipboard('recTP2', this)" class="px-2 py-1 text-[10px] bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 rounded font-bold transition-all cursor-pointer">Copy</button>
                                </div>
                            </div>
                            <div class="flex justify-between items-center p-2.5 bg-white dark:bg-gray-800/90 rounded-xl border border-gray-100 dark:border-gray-700/60">
                                <span class="text-xs font-bold text-gray-600 dark:text-gray-300">TP 3 (1:3)</span>
                                <div class="flex items-center gap-2">
                                    <span id="recTP3" class="font-mono font-bold text-green-600 dark:text-green-400 text-sm">-</span>
                                    <button onclick="copyToClipboard('recTP3', this)" class="px-2 py-1 text-[10px] bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 rounded font-bold transition-all cursor-pointer">Copy</button>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

            </div>

        </div>
    </div>

    <script>
        let currentDirection = 'BUY';
        let slMode = 'POINTS'; // 'POINTS' | 'PRICE'
        let tpMode = 'POINTS'; // 'POINTS' | 'PRICE'
        let isDark = false;

        // 1. DARK MODE CONTROLLER
        function applyTheme(darkModeActive) {
            isDark = darkModeActive;
            const themeIcon = document.getElementById('themeIcon');
            const themeText = document.getElementById('themeText');
            
            if (isDark) {
                document.documentElement.classList.add('dark');
                themeIcon.innerText = '☀️'; 
                themeText.innerText = 'Light';
            } else {
                document.documentElement.classList.remove('dark');
                themeIcon.innerText = '🌙'; 
                themeText.innerText = 'Dark';
            }
            
            setDirection(currentDirection, false);
            updateSlModeUI();
            updateTpModeUI();
        }

        function toggleDarkMode() {
            const nextState = !isDark;
            applyTheme(nextState);
            localStorage.setItem('trading_theme', nextState ? 'dark' : 'light');
        }

        // 2. STOPLOSS & TAKE PROFIT MODE SWITCHERS
        function setSlMode(mode) {
            slMode = mode;
            updateSlModeUI();
            saveAndCalculate();
        }

        function updateSlModeUI() {
            const btnPoint = document.getElementById('btnSlModePoint');
            const btnPrice = document.getElementById('btnSlModePrice');
            const info = document.getElementById('slPointInfo');

            const activeClass = "bg-red-500 text-white shadow-sm";
            const inactiveClass = "text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white";

            if (slMode === 'POINTS') {
                btnPoint.className = `px-2.5 py-1 rounded-md transition-all cursor-pointer ${activeClass}`;
                btnPrice.className = `px-2.5 py-1 rounded-md transition-all cursor-pointer ${inactiveClass}`;
                info.style.display = 'block';
            } else {
                btnPrice.className = `px-2.5 py-1 rounded-md transition-all cursor-pointer ${activeClass}`;
                btnPoint.className = `px-2.5 py-1 rounded-md transition-all cursor-pointer ${inactiveClass}`;
                info.style.display = 'none';
            }
        }

        function setTpMode(mode) {
            tpMode = mode;
            updateTpModeUI();
            saveAndCalculate();
        }

        function updateTpModeUI() {
            const btnPoint = document.getElementById('btnTpModePoint');
            const btnPrice = document.getElementById('btnTpModePrice');
            const info = document.getElementById('tpPointInfo');

            const activeClass = "bg-green-500 text-white shadow-sm";
            const inactiveClass = "text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white";

            if (tpMode === 'POINTS') {
                btnPoint.className = `px-2.5 py-1 rounded-md transition-all cursor-pointer ${activeClass}`;
                btnPrice.className = `px-2.5 py-1 rounded-md transition-all cursor-pointer ${inactiveClass}`;
                info.style.display = 'block';
            } else {
                btnPrice.className = `px-2.5 py-1 rounded-md transition-all cursor-pointer ${activeClass}`;
                btnPoint.className = `px-2.5 py-1 rounded-md transition-all cursor-pointer ${inactiveClass}`;
                info.style.display = 'none';
            }
        }

        // 3. DIRECTION CONTROLLER (BUY/SELL)
        function setDirection(direction, triggerSave = true) {
            currentDirection = direction;
            const btnBuy = document.getElementById('btnBuy');
            const btnSell = document.getElementById('btnSell');

            if (direction === 'BUY') {
                btnBuy.className = "py-3 rounded-xl font-bold text-center border-2 border-green-500 bg-green-500 text-white shadow-lg shadow-green-500/20 cursor-pointer transition-all";
                btnSell.className = "py-3 rounded-xl font-bold text-center border-2 border-red-500/30 text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/30 cursor-pointer transition-all";
            } else {
                btnSell.className = "py-3 rounded-xl font-bold text-center border-2 border-red-500 bg-red-500 text-white shadow-lg shadow-red-500/20 cursor-pointer transition-all";
                btnBuy.className = "py-3 rounded-xl font-bold text-center border-2 border-green-500/30 text-green-600 dark:text-green-400 hover:bg-green-50 dark:hover:bg-green-950/30 cursor-pointer transition-all";
            }
            
            if (triggerSave) saveAndCalculate();
            else calculate();
        }

        // 4. AUTO SAVE STATE
        function saveAndCalculate() {
            localStorage.setItem('tr_entryPrice', document.getElementById('entryPrice').value);
            localStorage.setItem('tr_spreadPoints', document.getElementById('spreadPoints').value);
            localStorage.setItem('tr_slValue', document.getElementById('slValue').value);
            localStorage.setItem('tr_slMode', slMode);
            localStorage.setItem('tr_tpValue', document.getElementById('tpValue').value);
            localStorage.setItem('tr_tpMode', tpMode);
            localStorage.setItem('tr_decimalPlaces', document.getElementById('decimalPlaces').value);
            localStorage.setItem('tr_direction', currentDirection);

            localStorage.setItem('tr_adjEntry', document.getElementById('chkAdjustEntry').checked);
            localStorage.setItem('tr_adjSL', document.getElementById('chkAdjustSL').checked);
            localStorage.setItem('tr_adjTP', document.getElementById('chkAdjustTP').checked);

            const spreadPoints = parseFloat(document.getElementById('spreadPoints').value) || 0;
            document.getElementById('spreadInfo').innerText = `*${spreadPoints} points = ${spreadPoints / 10} pips`;

            if (slMode === 'POINTS') {
                const slVal = parseFloat(document.getElementById('slValue').value) || 0;
                document.getElementById('slPointInfo').innerText = `*${slVal / 10} Pips`;
            }

            if (tpMode === 'POINTS') {
                const tpVal = parseFloat(document.getElementById('tpValue').value) || 0;
                document.getElementById('tpPointInfo').innerText = `*${tpVal / 10} Pips`;
            }

            calculate();
        }

        // 5. RESTORE STATE ON LOAD
        function loadSavedState() {
            const savedTheme = localStorage.getItem('trading_theme');
            applyTheme(savedTheme !== null ? savedTheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches);

            if (localStorage.getItem('tr_entryPrice') !== null) document.getElementById('entryPrice').value = localStorage.getItem('tr_entryPrice');
            if (localStorage.getItem('tr_spreadPoints') !== null) document.getElementById('spreadPoints').value = localStorage.getItem('tr_spreadPoints');
            if (localStorage.getItem('tr_slValue') !== null) document.getElementById('slValue').value = localStorage.getItem('tr_slValue');
            if (localStorage.getItem('tr_tpValue') !== null) document.getElementById('tpValue').value = localStorage.getItem('tr_tpValue');
            if (localStorage.getItem('tr_decimalPlaces') !== null) document.getElementById('decimalPlaces').value = localStorage.getItem('tr_decimalPlaces');
            
            if (localStorage.getItem('tr_adjEntry') !== null) document.getElementById('chkAdjustEntry').checked = localStorage.getItem('tr_adjEntry') === 'true';
            if (localStorage.getItem('tr_adjSL') !== null) document.getElementById('chkAdjustSL').checked = localStorage.getItem('tr_adjSL') === 'true';
            if (localStorage.getItem('tr_adjTP') !== null) document.getElementById('chkAdjustTP').checked = localStorage.getItem('tr_adjTP') === 'true';

            slMode = localStorage.getItem('tr_slMode') || 'POINTS';
            tpMode = localStorage.getItem('tr_tpMode') || 'POINTS';
            
            setDirection(localStorage.getItem('tr_direction') || 'BUY', false);
        }

        // 6. CORE CALCULATOR LOGIC
        function calculate() {
            const baseEntry = parseFloat(document.getElementById('entryPrice').value);
            const spreadPoints = parseFloat(document.getElementById('spreadPoints').value);
            const rawSlValue = parseFloat(document.getElementById('slValue').value);
            const rawTpVal = parseFloat(document.getElementById('tpValue').value);
            const decimals = parseInt(document.getElementById('decimalPlaces').value);

            const adjustEntry = document.getElementById('chkAdjustEntry').checked;
            const adjustSL = document.getElementById('chkAdjustSL').checked;
            const adjustTP = document.getElementById('chkAdjustTP').checked;

            if (isNaN(baseEntry) || isNaN(spreadPoints) || isNaN(rawSlValue)) return;

            const pointUnit = Math.pow(10, -decimals);
            const spreadValue = spreadPoints * pointUnit;

            // 1. Effective Entry
            let realEntry = baseEntry;
            if (adjustEntry) {
                realEntry = currentDirection === 'SELL' ? baseEntry - spreadValue : baseEntry + spreadValue;
            }

            // 2. Base SL Price & Effective SL
            let baseSLPrice = 0;
            if (slMode === 'POINTS') {
                const slPointsVal = rawSlValue * pointUnit;
                baseSLPrice = currentDirection === 'SELL' ? baseEntry + slPointsVal : baseEntry - slPointsVal;
            } else {
                baseSLPrice = rawSlValue;
            }

            let finalSL = baseSLPrice;
            if (adjustSL) {
                finalSL = currentDirection === 'SELL' ? baseSLPrice + spreadValue : baseSLPrice - spreadValue;
            }

            // 3. Calculate Risk Distance
            const riskSize = Math.abs(finalSL - realEntry);

            // 4. Custom TP Calculation
            let finalCustomTP = 0;
            if (!isNaN(rawTpVal)) {
                let baseTPPrice = 0;
                if (tpMode === 'POINTS') {
                    const tpPointsVal = rawTpVal * pointUnit;
                    baseTPPrice = currentDirection === 'SELL' ? baseEntry - tpPointsVal : baseEntry + tpPointsVal;
                } else {
                    baseTPPrice = rawTpVal;
                }

                // Logika Penyesuaian Spread untuk TP:
                // Jika dicentang: SELL -> TP + Spread | BUY -> TP - Spread
                // Jika tidak dicentang: Tetap baseTPPrice
                if (adjustTP) {
                    finalCustomTP = currentDirection === 'SELL' ? baseTPPrice + spreadValue : baseTPPrice - spreadValue;
                } else {
                    finalCustomTP = baseTPPrice;
                }
            }

            // 5. Recommend TP (1:1, 1:2, 1:3)
            const rec1 = currentDirection === 'SELL' ? realEntry - (riskSize * 1) : realEntry + (riskSize * 1);
            const rec2 = currentDirection === 'SELL' ? realEntry - (riskSize * 2) : realEntry + (riskSize * 2);
            const rec3 = currentDirection === 'SELL' ? realEntry - (riskSize * 3) : realEntry + (riskSize * 3);

            // Render Results
            document.getElementById('outEntry').innerText = realEntry.toFixed(decimals);
            document.getElementById('outSL').innerText = finalSL.toFixed(decimals);
            document.getElementById('outCustomTP').innerText = finalCustomTP !== 0 ? finalCustomTP.toFixed(decimals) : "-";

            document.getElementById('recTP1').innerText = rec1.toFixed(decimals);
            document.getElementById('recTP2').innerText = rec2.toFixed(decimals);
            document.getElementById('recTP3').innerText = rec3.toFixed(decimals);
        }

        // 7. COPY TO CLIPBOARD
        function copyToClipboard(elementId, btnElement) {
            const textToCopy = document.getElementById(elementId).innerText;
            if (textToCopy === "-") return;

            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalText = btnElement.innerText;
                btnElement.innerText = "Copied!";
                btnElement.style.pointerEvents = "none";
                
                setTimeout(() => {
                    btnElement.innerText = originalText;
                    btnElement.style.pointerEvents = "auto";
                }, 1500);
            }).catch(err => {
                console.error("Gagal menyalin text: ", err);
            });
        }

        window.onload = function() {
            loadSavedState();
        };
    </script>
</body>
</html>
