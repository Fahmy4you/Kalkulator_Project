 <style>
html,body { max-width:100%; overflow-x:hidden; }
body { font-family:'Poppins',sans-serif; }
.no-scrollbar { scrollbar-width:none; } .no-scrollbar::-webkit-scrollbar { display:none; }
[hidden] { display:none!important; }
.time-panel { width:100%; max-width:48rem; background:#fff; border:1px solid #e5e7eb; border-radius:1.5rem; padding:clamp(1rem,3vw,2rem); box-shadow:0 20px 25px -5px rgb(0 0 0 / .1); }
.dark .time-panel { background:#111827; border-color:#1f2937; }
.time-title { font-size:clamp(1.15rem,3vw,1.5rem); font-weight:800; color:#2563eb; }
.dark .time-title { color:#60a5fa; }
.subtle { color:#6b7280; font-size:.75rem; line-height:1.7; }
.dark .subtle { color:#9ca3af; }
.form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1rem; }
.full { grid-column:1/-1; }
.field label, .field-label { display:block; font-size:.75rem; font-weight:700; margin-bottom:.4rem; }
.control { width:100%; min-width:0; border:1px solid #d1d5db; border-radius:.75rem; background:#f9fafb; color:#111827; padding:.65rem .8rem; min-height:44px; font-size:.875rem; }
.dark .control { background:#1f2937; border-color:#374151; color:#fff; color-scheme:dark; }
.control:focus-visible,button:focus-visible,a:focus-visible,input[type=checkbox]:focus-visible { outline:3px solid #3b82f6; outline-offset:3px; }
.control:disabled { opacity:.65; }
.inline-fields { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:.65rem; }
.check-row { display:flex; align-items:center; gap:.65rem; font-size:.875rem; font-weight:600; min-height:44px; }
.check-row input { width:1.1rem; height:1.1rem; accent-color:#2563eb; }
.help { margin-top:.35rem; min-height:1.1em; font-size:.7rem; color:#6b7280; }
.dark .help { color:#9ca3af; }
.actions { display:flex; flex-wrap:wrap; gap:.6rem; margin-top:1.25rem; }
.time-button { min-height:44px; padding:.65rem 1rem; border-radius:.75rem; font-weight:700; font-size:.8rem; cursor:pointer; border:1px solid transparent; }
.primary { background:#2563eb; color:#fff; } .primary:hover { background:#1d4ed8; }
.secondary { background:#f3f4f6; color:#374151; border-color:#d1d5db; } .dark .secondary { background:#1f2937; color:#e5e7eb; border-color:#374151; }
.danger { background:#dc2626; color:#fff; } .danger:hover { background:#b91c1c; }
button:disabled { opacity:.45; cursor:not-allowed; }
.time-display { margin-top:1.5rem; padding:1.5rem .75rem; text-align:center; border:1px solid #e5e7eb; background:#f9fafb; border-radius:1rem; }
.dark .time-display { background:#1f2937; border-color:#374151; }
.digits { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-variant-numeric:tabular-nums; font-weight:800; font-size:clamp(2.2rem,9vw,4.5rem); line-height:1.2; letter-spacing:-.04em; }
.clock-digits { font-size:clamp(2.5rem,11vw,6rem); }
.error { color:#dc2626; font-size:.8rem; line-height:1.6; margin-top:.75rem; } .error:empty { display:none; } .dark .error { color:#fca5a5; }
.alarm-banner { margin-top:1rem; border:1px solid #f59e0b; background:#fffbeb; color:#92400e; border-radius:.75rem; padding:.8rem; font-size:.8rem; font-weight:600; } .dark .alarm-banner { background:#451a03; color:#fde68a; }
.time-meta { margin-top:1rem; display:grid; grid-template-columns:1fr 1fr; gap:.75rem; font-size:.75rem; }
.time-meta strong { display:block; margin-top:.25rem; font-size:.85rem; }
@media(max-width:480px) { .form-grid { grid-template-columns:1fr; } .time-meta { grid-template-columns:1fr; } }
@media(prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important; scroll-behavior:auto!important; } }
</style>
