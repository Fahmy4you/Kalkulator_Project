<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Ilmiah - Trading Suite</title>
    
    <!-- Google Fonts Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
    <!-- Tailwind CSS v3 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        oled: '#000000',
                    }
                }
            }
        }
    </script>

    <!-- Theme State Initializer (No Flash) -->
    <script>
        (function() {
            const saved = localStorage.getItem('trading_theme') || localStorage.getItem('modecolor');
            if (saved === 'light') {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('modecolor', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('modecolor', 'dark');
            }
        })();
    </script>

    <style>
        html, body {
            max-width: 100%;
            overflow-x: hidden;
            font-family: 'Poppins', sans-serif;
        }

        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Riwayat Backdrop Blur */
        .bg-blur {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 60;
        }
        .bg-blur.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* Riwayat Drawer Sliding */
        #riwayat_content {
            position: fixed;
            top: 0;
            right: 0;
            height: 100vh;
            width: 100%;
            max-width: 460px;
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 61;
            display: flex;
            flex-direction: column;
        }
        #riwayat_content.active {
            transform: translateX(0);
        }

        /* Style list riwayat */
        #list_riwayat li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.85rem 1rem;
            border-radius: 0.875rem;
            background-color: #f3f4f6;
            border: 1px solid #e5e7eb;
            margin-bottom: 0.625rem;
            transition: all 0.2s;
        }
        .dark #list_riwayat li {
            background-color: #121212;
            border-color: #262626;
        }
        #list_riwayat li h4 {
            font-size: 0.8125rem;
            font-weight: 600;
            color: #374151;
            word-break: break-all;
        }
        .dark #list_riwayat li h4 {
            color: #d1d5db;
        }
        #list_riwayat li p {
            font-size: 1.125rem;
            font-weight: 700;
            color: #2563eb;
            margin-top: 0.25rem;
        }
        .dark #list_riwayat li p {
            color: #60a5fa;
        }
        #list_riwayat li .hapus_riwayat {
            color: #ef4444;
            padding: 0.4rem 0.6rem;
            border-radius: 0.5rem;
            cursor: pointer;
            background: transparent;
            border: none;
            transition: background 0.2s;
        }
        #list_riwayat li .hapus_riwayat:hover {
            background-color: rgba(239, 68, 68, 0.15);
        }
        #list_riwayat .not_found_text {
            text-align: center;
            color: #9ca3af;
            font-size: 0.875rem;
            padding: 3rem 1rem;
            font-weight: 500;
        }

        /* 2nd toggle active state */
        .second-toggle.active {
            background-color: #2563eb !important;
            color: #ffffff !important;
            border-color: #2563eb !important;
        }
    </style>
</head>

    <!-- THEME SYNCHRONIZATION BRIDGE -->
    <script>
        function toggleDarkMode() {
            const modecolorBtn = document.getElementById('modecolor');
            if (modecolorBtn) {
                modecolorBtn.click();
            } else {
                document.documentElement.classList.toggle('dark');
            }
            syncThemeUI();
        }

        function syncThemeUI() {
            const isDark = document.documentElement.classList.contains('dark');
            const themeIcon = document.getElementById('themeIcon');
            const themeText = document.getElementById('themeText');
            if (themeIcon) themeIcon.innerText = isDark ? '☀️' : '🌙';
            if (themeText) themeText.innerText = isDark ? 'Light' : 'Dark';
            localStorage.setItem('trading_theme', isDark ? 'dark' : 'light');
        }

        // Close drawer when clicking backdrop
        const backdropEl = document.querySelector('.bg-blur');
        if (backdropEl) {
            backdropEl.addEventListener('click', () => {
                const closeBtn = document.getElementById('close_riwayat');
                if (closeBtn) closeBtn.click();
            });
        }

        // Run sync on DOMContentLoaded
        document.addEventListener('DOMContentLoaded', () => {
            syncThemeUI();
        });
    </script>
